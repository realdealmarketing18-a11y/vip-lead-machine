<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Section Rhythm" subtitle="white → beige → white → navy alternation" viewport="700x320" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Section Rhythm · VIP Home Painting</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; font-family: var(--font-sans); }
  .card { display: flex; flex-direction: column; }
  .sec { padding: 16px 22px; min-height: 56px; display: flex; align-items: center; justify-content: space-between; font-family: var(--font-serif); font-weight: 600; font-size: 15px; }
  .s1 { background: #fff; color: var(--vip-navy); }
  .s2 { background: var(--vip-cream-deep); color: var(--vip-navy); }
  .s3 { background: #fff; color: var(--vip-navy); }
  .s4 { background: var(--vip-navy); color: #fff; }
  .s5 { background: var(--vip-cream); color: var(--vip-navy); }
  .s6 { background: var(--vip-navy-deep); color: #fff; }
  .accent {
    background: #E8833A; color: #fff;
    padding: 12px 22px; min-height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-sans); font-weight: 700; font-size: 11.5px; letter-spacing: 0.20em; text-transform: uppercase;
  }
  .tag { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; opacity: 0.6; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .accent .tag { color: #fff; opacity: 0.8; }
</style>
</head>
<body>
<div class="card">
  <div class="sec s1">Hero · trust pills · palette<span class="tag">white</span></div>
  <div class="accent">Brand Orange · Primary Highlight<span class="tag">#E8833A — CTA / urgency band</span></div>
  <div class="sec s2">Education + Trust<span class="tag">cream-deep</span></div>
  <div class="sec s3">Process steps<span class="tag">white</span></div>
  <div class="sec s4">Case studies (B/A sliders)<span class="tag">navy</span></div>
  <div class="sec s5">Offers · services · testimonials<span class="tag">cream</span></div>
  <div class="accent">Limited-Time Offer<span class="tag">#E8833A — accent band</span></div>
  <div class="sec s3">Scope of work · final CTA<span class="tag">white</span></div>
  <div class="sec s6">Footer<span class="tag">navy-deep</span></div>
</div>
</body>
</html>
