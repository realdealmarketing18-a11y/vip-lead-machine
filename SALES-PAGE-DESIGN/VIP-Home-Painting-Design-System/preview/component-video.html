<!DOCTYPE html>
<!-- @dsCard group="Components" name="Video Frame" subtitle="Gold-bordered Before/After embed" viewport="700x320" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video / Before-After Frame · VIP Home Painting</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-sans); }
  .card { padding: 28px; }
  .frame { position: relative; aspect-ratio: 16/10; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-xl); background: linear-gradient(135deg,#2a2f5a 0%, var(--vip-navy) 60%, #0E1230 100%); }
  .frame::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 6; border: 2.5px solid transparent; background: var(--vip-gold-shine-b) border-box; -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .play { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 4; width: 80px; height: 80px; border-radius: 50%; background: var(--vip-gold-shine-b); box-shadow: 0 0 0 6px rgba(201,169,97,0.18), 0 14px 32px rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; }
  .play::before { content: ''; width: 0; height: 0; border-style: solid; border-width: 12px 0 12px 18px; border-color: transparent transparent transparent #fff; margin-left: 4px; }
  .ba-l, .ba-r { position: absolute; top: 16px; z-index: 7; background: rgba(26,31,78,0.85); backdrop-filter: blur(8px); color: #fff; font-family: var(--font-sans); font-weight: 700; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; padding: 8px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); }
  .ba-l { left: 16px; }
  .ba-r { right: 16px; }
  .seam { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: rgba(255,255,255,0.9); z-index: 5; }
</style>
</head>
<body>
<div class="card">
  <div class="frame">
    <div class="seam"></div>
    <div class="play"></div>
    <div class="ba-l">Before</div>
    <div class="ba-r">After</div>
  </div>
</div>
</body>
</html>
