<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checklist · VIP Home Painting</title>

<style>

  .card { padding: 32px; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }

</style>
</head>
<body>
<div class="card">
  <ul>
    <li>Protects Against Arizona's Harsh Climate</li>
    <li>Increases Property Value Instantly</li>
    <li>Makes Your Home the Envy of the Neighborhood</li>
    <li>Lasts for Years with Proper Preparation</li>
