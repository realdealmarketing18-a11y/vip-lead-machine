<!DOCTYPE html>
<!-- @dsCard group="Components" name="Paint Dots Picker" subtitle="Glossy SW paint drops — hero color selection" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Paint Dots Picker · VIP Home Painting</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-sans); }
  .card { padding: 32px; }
  .title { font-family: var(--font-sans); font-weight: 700; font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--vip-gold-deep); margin-bottom: 22px; text-align: center; }
  .list { display: flex; gap: 28px; justify-content: center; }
  .item { text-align: center; }
  .dot { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto; box-shadow: inset -8px -10px 16px rgba(0,0,0,0.20), inset 6px 8px 12px rgba(255,255,255,0.45), 0 8px 22px rgba(26,31,78,0.18); position: relative; }
  .dot::after { content: ''; position: absolute; top: 14%; left: 22%; width: 30%; height: 24%; border-radius: 50%; background: rgba(255,255,255,0.55); filter: blur(4px); }
  .code { font-family: var(--font-sans); font-weight: 600; font-size: 11px; color: var(--vip-navy); margin-top: 12px; letter-spacing: 0.04em; }
  .role { font-family: var(--font-serif); font-style: italic; font-size: 12.5px; color: #4A4F70; margin-top: 2px; }
</style>
</head>
<body>
<div class="card">
  <div class="title">Our Color Selection</div>
  <div class="list">
    <div class="item"><div class="dot" style="background:#A89770"></div><div class="code">SW 2017</div><div class="role">Main Body</div></div>
    <div class="item"><div class="dot" style="background:#F4F0E5"></div><div class="code">SW 206B</div><div class="role">Trim</div></div>
    <div class="item"><div class="dot" style="background:#6E7A5B"></div><div class="code">SW 2019</div><div class="role">Gable</div></div>
    <div class="item"><div class="dot" style="background:#6E2A2A"></div><div class="code">SW 2016</div><div class="role">Front Door</div></div>
  </div>
</div>
</body>
</html>
