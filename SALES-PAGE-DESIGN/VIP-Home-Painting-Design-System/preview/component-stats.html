<!DOCTYPE html>
<!-- @dsCard group="Components" name="Stat Cards" subtitle="5 ★ · 100% · 120+ — trust numbers" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stat Cards · VIP Home Painting</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--vip-cream); font-family: var(--font-sans); }
  .card { padding: 36px 28px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }

  .stat {
    position: relative;
    padding: 26px 16px 22px;
    border-radius: 14px;
    text-align: center;
    border: 1.5px solid transparent;
    background:
      linear-gradient(#fff, #fff) padding-box,
      linear-gradient(180deg, #3A4078 0%, #1A1F4E 55%, #0C1130 100%) border-box;
    box-shadow:
      0 0 0 1px rgba(12,17,48,0.20),
      0 22px 44px rgba(26,31,78,0.22),
      0 6px 14px rgba(26,31,78,0.14),
      inset 0 1px 0 rgba(255,255,255,0.65);
    transition: transform 320ms cubic-bezier(.22,1,.36,1), box-shadow 320ms;
  }
  .stat:hover {
    transform: translateY(-3px);
    box-shadow:
      0 0 0 1px rgba(12,17,48,0.25),
      0 28px 56px rgba(26,31,78,0.28),
      0 8px 18px rgba(26,31,78,0.18),
      inset 0 1px 0 rgba(255,255,255,0.65);
  }

  /* Gold tab — luxury detail, top-left */
  .stat::before {
    content: '';
    position: absolute;
    top: -1px; left: 22px; width: 48px; height: 3px;
    background: var(--vip-gold-shine);
    border-radius: 0 0 4px 4px;
  }

  .num {
    font-family: var(--font-serif); font-weight: 700;
    font-size: 48px; color: var(--vip-navy);
    line-height: 1; letter-spacing: -0.02em;
    margin-top: 6px;
  }
  .num em { font-style: italic; font-weight: 500; color: var(--vip-gold-deep); }
  .num span { font-family: var(--font-sans); font-weight: 800; font-size: 18px; color: var(--vip-gold-deep); letter-spacing: 0.04em; vertical-align: 6px; }

  /* Hairline divider above the label */
  .label {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(26,31,78,0.10);
    font-family: var(--font-serif); font-style: italic;
    font-size: 13px; color: var(--vip-gold-deep);
    line-height: 1.3;
  }
  .label b { display: block; font-style: normal; font-family: var(--font-serif); font-weight: 600; color: var(--vip-navy); font-size: 14px; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="card">
  <div class="stat">
    <div class="num">5<em>★</em></div>
    <div class="label"><b>Star Reviews</b>Every client, every project</div>
  </div>
  <div class="stat">
    <div class="num">100<span>%</span></div>
    <div class="label"><b>Clients Satisfied</b>No exceptions</div>
  </div>
  <div class="stat">
    <div class="num">120<span>+</span></div>
    <div class="label"><b>Projects Done</b>Across SoCal estates</div>
  </div>
  <div class="stat">
    <div class="num">1<em>yr</em></div>
    <div class="label"><b>Insane Warranty</b>No questions asked</div>
  </div>
</div>
</body>
</html>
