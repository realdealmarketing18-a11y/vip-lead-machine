<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing Tokens" subtitle="8pt grid — sp-1 through sp-24" viewport="700x360" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spacing Tokens · VIP Home Painting</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-sans); }
  .card { padding: 28px; }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .name { width: 96px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--vip-navy); font-weight: 600; }
  .bar { background: var(--vip-gold); height: 14px; border-radius: 4px; box-shadow: var(--shadow-xs); }
  .px { width: 80px; text-align: right; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-muted); }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="name">--sp-1</div><div class="bar" style="width:4px"></div><div class="px">4px</div></div>
  <div class="row"><div class="name">--sp-2</div><div class="bar" style="width:8px"></div><div class="px">8px</div></div>
  <div class="row"><div class="name">--sp-3</div><div class="bar" style="width:12px"></div><div class="px">12px</div></div>
  <div class="row"><div class="name">--sp-4</div><div class="bar" style="width:16px"></div><div class="px">16px</div></div>
  <div class="row"><div class="name">--sp-6</div><div class="bar" style="width:24px"></div><div class="px">24px</div></div>
  <div class="row"><div class="name">--sp-8</div><div class="bar" style="width:32px"></div><div class="px">32px</div></div>
  <div class="row"><div class="name">--sp-12</div><div class="bar" style="width:48px"></div><div class="px">48px</div></div>
  <div class="row"><div class="name">--sp-16</div><div class="bar" style="width:64px"></div><div class="px">64px · section pad</div></div>
  <div class="row"><div class="name">--sp-24</div><div class="bar" style="width:96px"></div><div class="px">96px</div></div>
</div>
</body>
</html>
