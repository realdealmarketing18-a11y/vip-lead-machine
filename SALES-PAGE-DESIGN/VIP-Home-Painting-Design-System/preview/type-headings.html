<!DOCTYPE html>
<!-- @dsCard group="Type" name="Heading Scale" subtitle="H1 → H4 in Fraunces" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Headings Scale · VIP Home Painting</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-sans); }
  .card { padding: 28px; display: grid; grid-template-columns: 84px 1fr 110px; row-gap: 16px; column-gap: 18px; align-items: baseline; }
  .label { font-size: 11px; color: var(--fg-muted); font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.04em; }
  .specimen { font-family: var(--font-serif); color: var(--vip-navy); font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
  .specimen em { font-style: italic; font-weight: 500; color: var(--vip-gold-deep); }
  .meta { font-size: 11px; color: var(--fg-muted); font-family: ui-monospace, Menlo, monospace; text-align: right; }
</style>
</head>
<body>
<div class="card">
  <div class="label">H1</div><div class="specimen" style="font-size:48px">Transform Your <em>Home</em></div><div class="meta">52 / Semi 600</div>
  <div class="label">H2</div><div class="specimen" style="font-size:38px">Avoid Costly <em>Mistakes</em></div><div class="meta">42 / Semi 600</div>
  <div class="label">H3</div><div class="specimen" style="font-size:30px">Personalized Color Consultation</div><div class="meta">32 / Semi 600</div>
  <div class="label">H4</div><div class="specimen" style="font-size:24px">Insane 1-Year Warranty</div><div class="meta">26 / Semi 600</div>
</div>
</body>
</html>
