<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Trust Badges" subtitle="Gold-laurel: warranty + custom color schemes" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trust Badges · VIP Home Painting</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-sans); }

  .panel { background: #fff; border-radius: 16px; padding: 16px; display: flex; align-items: center; justify-content: center; min-height: 220px; border: 1px solid rgba(26,31,78,0.10); box-shadow: 0 8px 24px rgba(26,31,78,0.10); }
  img { max-width: 100%; max-height: 220px; object-fit: contain; }
  .label { font-size: 11px; color: var(--fg-muted); font-family: ui-monospace, Menlo, monospace; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="panel"><img src="../assets/badges/vip-warranty-laurel.png" alt="Warranty laurel"></div>
    <div class="label">Insane 1-Year Warranty · gold laurel PNG</div>
  </div>
  <div>
    <div class="panel"><img src="../assets/badges/vip-custom-color-schemes.png" alt="Custom color laurel"></div>
    <div class="label">Custom Color Schemes · gold laurel PNG</div>
  </div>
</div>
</body>
</html>
