<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo Marks" subtitle="Primary & stacked split paintbrush-crown" viewport="700x240" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo Marks · VIP Home Painting</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; font-family: var(--font-sans); }
  .card { padding: 28px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 22px; }
  .item { display: flex; flex-direction: column; }
  .panel {
    background: transparent;
    border-radius: 14px;
    padding: 24px;
    display: flex; align-items: center; justify-content: center;
    min-height: 200px;
  }
  .panel img { max-width: 100%; max-height: 160px; object-fit: contain; display: block; }
  .label {
    font-family: var(--font-sans); font-weight: 700; font-size: 10.5px;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--vip-gold-deep); margin-top: 10px; text-align: center;
  }
  .label em { font-family: var(--font-serif); font-style: italic; font-weight: 500; color: var(--vip-navy); letter-spacing: 0.02em; text-transform: none; font-size: 13px; display: block; margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="item">
    <div class="panel"><img src="../assets/logos/vip-logo-primary.png" alt="VIP primary"/></div>
    <div class="label">Primary<em>Full lockup</em></div>
  </div>
  <div class="item">
    <div class="panel"><img src="../assets/logos/vip-logo-stacked.png" alt="VIP stacked"/></div>
    <div class="label">Stacked Split<em>Wordmark + icon</em></div>
  </div>
  <div class="item">
    <div class="panel" style="background:#FFFFFF; box-shadow: 0 10px 26px rgba(26,31,78,0.10); border:1px solid rgba(26,31,78,0.06);"><img src="../assets/logos/vip-mark-icon-white.png" alt="VIP mark" style="max-height:140px;border-radius:8px;"/></div>
    <div class="label">Icon Mark<em>On white \u2014 stands out</em></div>
  </div>
</div>
</body>
</html>
